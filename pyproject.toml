[project]
name = "ksmech"
version = "0.1.0"
description = "Reaction mechanism prediction as orbital-arrow sequences, scored by a transformer biased by the Klopman-Salem equation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "rdkit",
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "torch",
    "tblite",
    "morfeus-ml",
    "hydra-core",
    "tqdm",
    "rich",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
