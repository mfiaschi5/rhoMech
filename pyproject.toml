[project]
name = "ksmech"
version = "0.1.0"
description = "Reaction mechanism prediction as orbital-arrow sequences, scored by a transformer biased by the Klopman-Salem equation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "rdkit",
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "tblite",
    "morfeus-ml",
    "hydra-core",
    "tqdm",
    "rich",
    "lightgbm>=4.7.0",
]

[project.scripts]
ksmech-data = "ksmech.data.cli:main"
ksmech-qm = "ksmech.qm.cli:main"
ksmech-orbitals = "ksmech.orbitals.cli:main"
ksmech-arrows = "ksmech.arrows.cli:main"
ksmech-physics = "ksmech.physics.cli:main"
ksmech-train = "ksmech.train.cli:main"
ksmech-eval = "ksmech.eval.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "pytest-xdist>=3.8.0",
]
# torch comes from one of two builds: ROCm (default here, AMD RX 6600 XT, run with
# HSA_OVERRIDE_GFX_VERSION=10.3.0) or CUDA (NVIDIA hosts: uv sync --no-group rocm --group cuda).
rocm = ["torch==2.14.1", "triton-rocm==3.8.0"]
cuda = ["torch==2.14.1"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
default-groups = ["dev", "rocm"]
conflicts = [[{ group = "rocm" }, { group = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", group = "rocm" },
    { index = "pytorch-cu130", group = "cuda" },
]
triton-rocm = [{ index = "pytorch-rocm", group = "rocm" }]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "realdata: runs on the real raw files in data/raw (skipped when absent)",
    "slow: runs GFN2 geometry optimizations (deselect with -m \"not slow\")",
    "diagnostic: checks the classifier's labels (lone pair, sigma, ...), which are never model input",
]
